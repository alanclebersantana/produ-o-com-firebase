<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Ateliê</title>
<meta name="description" content="Gestão de produção artesanal: encomendas, estoque, clientes, entregas e preços.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8670A8" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" id="fonteBase">
<link rel="stylesheet" id="fonteSel">

<!-- ============ FIREBASE (login com e-mail) ============
     1. Troque os valores de firebaseConfig abaixo pelos do SEU projeto
        (Firebase Console > Configurações do projeto > Seus apps > SDK setup and configuration).
     2. Se um dia trocar de versão do SDK, troque nas duas linhas dos scripts abaixo. -->
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};
firebase.initializeApp(firebaseConfig);
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#8670A8; --soft:#EBE3F4; --soft2:#E4DAF1; --bg:#F8F6FA; --card:#fff;
  --text:#524368; --dim:rgba(0,0,0,.55); --line:rgba(0,0,0,.08); --field:#fff;
  --danger:#B15347; --dangerBg:#F5DEDC; --ok:#4F8A62;
  --sh:0 2px 10px rgba(0,0,0,.05); --sh2:0 6px 24px rgba(0,0,0,.10);
  --r:16px; --safe:env(safe-area-inset-bottom,0px);
  --fTit:'Nunito',sans-serif; --fSub:'Nunito',sans-serif; --fBody:'Nunito',sans-serif; --esc:1;
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--fBody),-apple-system,'Segoe UI',sans-serif; font-size:calc(15px*var(--esc)); line-height:1.45;
  zoom:var(--esc);
  min-height:100dvh; transition:background .25s ease,color .25s ease;
  overscroll-behavior-y:none;
}
h1,h2,h3,.disp{font-weight:800;letter-spacing:-.005em}
h1,.disp{font-family:var(--fTit),sans-serif}
.eyebrow,.subview,.sect>h2,.grouplb,.sec>h2{font-family:var(--fSub),sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(88px + var(--safe))}
@media(min-width:900px){.wrap{max-width:940px;padding-bottom:32px}}
.dim{color:var(--dim)}
.hide{display:none!important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:var(--bg);padding:14px 16px 10px;
  max-width:520px;margin:0 auto;transition:background .25s}
@media(min-width:900px){header{max-width:940px}}
header.scrolled{box-shadow:0 1px 0 var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow,.subview,h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.subview{font-size:12.5px;color:var(--dim);margin-top:1px}
h1{font-size:22px;line-height:1.2;margin-top:1px}
.hbtns{display:flex;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--soft2);color:var(--accent);flex-shrink:0}
.iconbtn:active{filter:brightness(.94)}
.sheet .iconbtn,.card .iconbtn{background:none;color:var(--text);opacity:.6}
.deskNav{display:none}
@media(min-width:900px){
  .deskNav{display:flex;gap:2px;flex-wrap:wrap;margin-top:12px}
  .deskNav button{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:12px;font-size:14px;font-weight:700;opacity:.6}
  .deskNav button[aria-current="true"]{background:var(--soft2);color:var(--accent);opacity:1}
}

/* ---------- blocos ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.sec{margin-top:20px}
.sec>h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.sec>h2 .c{color:var(--accent)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(min-width:900px){.g2{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--soft);border-radius:var(--r);padding:14px}
.stat .n{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-.01em;
  display:block;line-height:1.15;font-variant-numeric:tabular-nums}
.g3 .stat .n{font-size:16.5px}
.stat .l{font-size:11.5px;color:var(--dim);display:block;margin-top:3px;line-height:1.3}
.stat .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.stat svg{color:var(--accent);opacity:.55;flex-shrink:0}

.rowcard{width:100%;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:14px;display:block;transition:transform .12s ease}
.rowcard:active{transform:scale(.985)}
.list{display:flex;flex-direction:column;gap:10px}
@media(min-width:900px){.list.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}}

.chip{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft2);color:var(--accent);
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip.warn{background:var(--dangerBg);color:var(--danger)}
.chip.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;background:var(--card);
  color:var(--dim);white-space:nowrap;box-shadow:var(--sh);flex-shrink:0}
.chips button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.chips.soft button[aria-pressed="true"]{background:var(--soft2);color:var(--accent)}

.hero{background:var(--accent);color:#fff;border-radius:var(--r);padding:17px 18px}
.hero .k{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;opacity:.78}
.hero .b{font-size:26px;font-weight:800;display:block;margin:3px 0 4px;letter-spacing:-.01em}
.hero .s{font-size:12.5px;opacity:.82}

.sect{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:15px;margin-top:12px}
.sect>h2{font-size:13.5px;color:var(--accent);display:flex;align-items:center;gap:7px;margin-bottom:12px}
.grouplb{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);margin:16px 0 8px}

.kb{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.kb::-webkit-scrollbar{display:none}
.kb .col{flex:0 0 76%;max-width:280px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:13px;scroll-snap-align:start}
@media(min-width:900px){.kb .col{flex:0 0 250px}}
.kb .colh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.kb .colh b{font-size:12.5px;color:var(--dim)}
.kb .cnt{background:var(--soft2);color:var(--accent);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:800}
.kb .kcard{width:100%;text-align:left;background:var(--bg);border-radius:12px;padding:10px;margin-bottom:8px}
.kb .kcard b{font-size:12.5px;display:block;line-height:1.3}

.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bg);border-radius:13px;padding:12px 14px}
.switch{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-pressed="true"]{background:var(--accent)}
.switch[aria-pressed="true"] i{transform:translateX(19px)}

.palcard{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px}
.palcard[aria-pressed="true"]{border-color:var(--text)}
.palcard .dots{display:flex;gap:5px;margin-bottom:7px}
.palcard .dots i{width:17px;height:17px;border-radius:50%;display:block;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.22)}
.palcard span{font-size:11.5px;font-weight:700}

.corlinha{display:flex;align-items:center;gap:11px;background:var(--bg);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.corlinha .bola{width:38px;height:38px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.corlinha .bola input{position:absolute;inset:-25%;width:150%;height:150%;border:0;padding:0;
  background:none;cursor:pointer;opacity:0}
.corlinha .txt{flex:1;min-width:0}
.corlinha .txt b{font-size:12.5px;display:block}
.corlinha .txt span{font-size:11px;color:var(--dim)}
.corlinha .hexv{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--dim);text-transform:uppercase}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:5px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:var(--soft2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;
  background:var(--accent);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:var(--soft2)}
input[type=range]::-moz-range-thumb{width:19px;height:19px;border:0;border-radius:50%;background:var(--accent)}
.previewbox{border-radius:var(--r);padding:13px;margin-top:4px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:14px;
  font-weight:800;font-size:14px}
.btn.primary{background:var(--accent);color:#fff}
.btn.soft{background:var(--soft2);color:var(--accent)}
.btn.line{border:1px solid var(--line);color:var(--dim)}
.btn.danger{color:var(--danger)}
.btn:active{filter:brightness(.96)}
.btn.sm{padding:9px;font-size:13px;border-radius:11px}

.prog{height:6px;border-radius:99px;background:var(--soft2);overflow:hidden;margin:10px 0 5px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.mini{background:var(--bg);border-radius:11px;padding:7px 6px;text-align:center}
.mini .l{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.mini .v{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.mini .v.acc{color:var(--accent)}

.empty{background:var(--card);border-radius:var(--r);padding:30px 22px;text-align:center;box-shadow:var(--sh)}
.empty svg{color:var(--accent);opacity:.35;margin-bottom:8px}
.empty p{font-size:14px;font-weight:700}
.empty span{font-size:12.5px;color:var(--dim);display:block;margin-top:3px}

/* ---------- nav ---------- */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + var(--safe));transition:background .25s;overflow-x:auto;scrollbar-width:none}
nav.bottom::-webkit-scrollbar{display:none}
@media(min-width:900px){nav.bottom{display:none}}
nav.bottom button{flex:0 0 auto;display:grid;place-items:center;padding:6px 11px;
  border-radius:12px;color:var(--text);opacity:.5}
nav.bottom button[aria-current="true"]{color:var(--accent);opacity:1}


/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:24px 24px 0 0;
  max-height:90dvh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:none}
@media(min-width:900px){.sheet{max-width:520px;margin:0 auto;border-radius:24px;bottom:24px;left:24px;right:24px}}
.grab{padding:9px 0 3px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:38px;height:4px;border-radius:99px;background:var(--line);display:block}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 20px 10px}
.sheet .sh h3{font-size:17px}
.sheet .sb{padding:0 20px calc(24px + var(--safe));overflow-y:auto;-webkit-overflow-scrolling:touch}
.field{display:block;margin-bottom:11px}
.field>span{font-size:11.5px;font-weight:800;color:var(--dim);display:block;margin-bottom:4px;letter-spacing:.01em}
.input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);
  color:var(--text);font-size:15px}
.input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.row{display:grid;gap:9px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}
.box{background:var(--card);border-radius:14px;padding:13px;box-shadow:var(--sh)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:13.5px}
.kv+.kv{border-top:1px solid var(--line)}
.kv b{font-variant-numeric:tabular-nums}

/* ---------- toast ---------- */
.toast{position:fixed;left:16px;right:16px;bottom:calc(78px + var(--safe));z-index:80;background:#26242A;color:#fff;
  border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh2);
  transform:translateY(20px);opacity:0;pointer-events:none;transition:.22s;font-size:13.5px;font-weight:600}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast button{color:#FFD79A;font-weight:800;font-size:13px;flex-shrink:0}
@media(min-width:900px){.toast{max-width:420px;left:auto;right:26px;bottom:96px}}

/* charts */
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  background:var(--bg);color:var(--dim);position:relative}
.cal .d.has{background:var(--soft2);color:var(--accent)}
.cal .d.hoje{outline:2px solid var(--accent)}
.cal .d .dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:99px;background:var(--accent)}
.cal .hd{font-size:9.5px;font-weight:800;text-align:center;color:var(--dim);text-transform:uppercase}
.swatch{aspect-ratio:1.5;border-radius:14px;display:grid;place-items:center;position:relative;border:2px solid transparent}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.thumb{width:100%;aspect-ratio:1.35;border-radius:14px;object-fit:cover;display:block;background:var(--soft2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- auth gate ---------- */
#authGate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#authGate .card{width:100%}
</style>
</head>
<body>
<div id="authGate" class="hide"></div>
<header id="hd">
  <div class="hrow">
    <div style="min-width:0">
      <p class="eyebrow" id="hSub"></p>
      <h1 id="hTitulo"></h1>
      <p class="subview" id="hSecao"></p>
    </div>
    <div class="hbtns">
      <button class="iconbtn" data-act="busca" aria-label="Buscar"></button>
      <button class="iconbtn" data-act="calc" aria-label="Calculadora"></button>
      <button class="iconbtn" data-act="modo" aria-label="Alternar modo escuro"></button>
      <button class="iconbtn" data-view="config" aria-label="Configurações"></button>
    </div>
  </div>
  <nav class="deskNav" id="deskNav"></nav>
</header>
<main class="wrap" id="app"></main>
<nav class="bottom" id="navBottom"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab" id="grab"><i></i></div>
  <div class="sh"><h3 id="sheetTit"></h3><button class="iconbtn" data-act="fechar" aria-label="Fechar"></button></div>
  <div class="sb" id="sheetBody"></div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">Desfazer</button></div>

const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t))};
const lum=h=>{const[r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
 return .2126*r+.7152*g+.0722*b};
const corTom=o=>{const t=num(o?.t)||0,c=o?.c||'#8670A8';
  return t>=0?mix(c,'#FFFFFF',t/100):mix(c,'#000000',-t/100)};
function varsCustom(escuro){

  const a=corTom(S.custom.a),b=corTom(S.custom.b),c=corTom(S.custom.c);
  if(!escuro)return{accent:a,soft:b,soft2:mix(b,a,.16),bg:c,card:'#FFFFFF',
    text:mix(a,'#191320',.5),dim:'rgba(0,0,0,.55)',line:'rgba(0,0,0,.08)',field:'#FFFFFF',
    dangerBg:'#F5DEDC',danger:'#B15347'};
  /* se a cor escolhida já é escura, ela é usada como está; se é clara, vira um tom noturno */
  const acc=lum(a)<.45?mix(a,'#FFFFFF',.30):a;
  const bg=lum(c)<.32?c:mix('#100F13',acc,.07);
  const card=mix(bg,'#FFFFFF',.055);
  const sf=lum(b)<.35?b:mix(bg,b,.12);
  return{accent:acc,soft:sf,soft2:mix(sf,acc,.16),bg,card,text:mix('#EFEBE5',acc,.14),
    dim:'rgba(255,255,255,.55)',line:'rgba(255,255,255,.09)',field:mix(card,'#FFFFFF',.05),
    dangerBg:'#4A2723',danger:'#E9968A'};
}

function migrar(d){
 d.custom=Object.assign(JSON.parse(JSON.stringify(CUSTOM_PADRAO)),d.custom||{});
 d.cfg=Object.assign({},CFG_PADRAO,d.cfg||{});
 d.cfg.notif=Object.assign({},CFG_PADRAO.notif,d.cfg.notif||{});

 if(!Array.isArray(d.cfg.metas.produtos))d.cfg.metas.produtos=[];
 d.cfg.metas.produtos.forEach(p=>{if(p.fixado===undefined)p.fixado=true;p.qtdAlvo=num(p.qtdAlvo)});
 if(!Array.isArray(d.cfg.ordemPainel)||d.cfg.ordemPainel.length!==ABAS.length)d.cfg.ordemPainel=ABAS.map(a=>a[0]);
 ['itens','clientes','estoque','catalogo'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
 d.itens.forEach(i=>{i.status=i.status||'producao';i.pagamentos=i.pagamentos||[];i.materiais=i.materiais||[];
  i.etapas=i.etapas||[];i.valorFrete=i.valorFrete||0;i.dataPedido=i.dataPedido||i.dataEntrega||hoje();
  i.quantidade=num(i.quantidade)||1;i.produtoId=i.produtoId||'';i.pedidoCod=i.pedidoCod||''});
 d.catalogo.forEach(c=>{c.materiais=c.materiais||[]});
 d.modo=d.modo||'auto';d.tema=d.tema||'areia';
 return d;
}

  const mensal=num(e.consumoPorItem)*num(e.producaoMensal)*fator;
  /* item recorrente entra na lista todo ciclo, mesmo com estoque cheio */
  const faltante=e.recorrente?Math.max(mensal,mensal+num(e.minimo)-num(e.qtd))
   :Math.max(0,mensal+num(e.minimo)-num(e.qtd));
  return{...e,mensal,faltante,valorComprar:faltante*num(e.custoUnitario)};
 });
}
function lembretes(){
 const L=[];
 S.itens.filter(aberto).forEach(it=>{
  (it.etapas||[]).forEach(et=>{if(!et.feita){const d=diasAte(et.data);if(d!==null&&d<=2)L.push({t:et.nome||'Etapa',item:it,data:et.data,d})}});
  const de=diasAte(it.dataEntrega);if(de!==null&&de<=2)L.push({t:'Entrega',item:it,data:it.dataEntrega,d:de});
  const dp=diasAte(it.dataPostagem);if(dp!==null&&dp<=2)L.push({t:'Postagem',item:it,data:it.dataPostagem,d:dp});
 });
 return L.sort((a,b)=>a.d-b.d);
}
function saidasMeses(n=6){
 const out=[],base=new Date();base.setDate(1);
 for(let k=n-1;k>=0;k--){
  const d=new Date(base.getFullYear(),base.getMonth()-k,1),ch=d.toISOString().slice(0,7);
  const ent=S.itens.filter(i=>i.status==='entregue'&&(dataRef(i)||'').slice(0,7)===ch);
  out.push({rot:MES[d.getMonth()],qtd:ent.length,receita:ent.reduce((s,i)=>s+totalItem(i),0),
   lucro:ent.reduce((s,i)=>s+lucroItem(i),0)});
 }
 return out;
}

/* linha SVG com área */
function linha(dados){
 const vals=dados.map(d=>d.v),max=Math.max(1,...vals),n=vals.length;
 const pt=i=>[ (n<2?50:i/(n-1)*96+2), 34-(vals[i]/max*28) ];
 const d=vals.map((v,i)=>{const[x,y]=pt(i);return (i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)}).join(' ');
 const area=d+` L ${pt(n-1)[0].toFixed(2)} 36 L ${pt(0)[0].toFixed(2)} 36 Z`;
 return `<svg class="chart" viewBox="0 0 100 40" preserveAspectRatio="none" role="img">
  <path d="${area}" fill="var(--accent)" opacity=".12"/>
  <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  ${vals.map((v,i)=>{const[x,y]=pt(i);return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.5" fill="var(--accent)"/>`}).join('')}
 </svg>

const SEMANAS_MES=4.345;
function calcMetaProdutos(){
 const m=S.cfg.metas||{semana:0,mes:0,produtos:[]};
 const prods=(m.produtos||[]).map(x=>({...x,p:S.catalogo.find(c=>c.id===x.id)})).filter(x=>x.p);
 /* a meta "de referência" pra planejar produtos é a mensal; se só houver semanal, convertemos p/ um equivalente mensal */
 const metaBase=num(m.mes)>0?num(m.mes):(num(m.semana)>0?num(m.semana)*SEMANAS_MES:0);
 const fixos=prods.filter(x=>x.fixado),autos=prods.filter(x=>!x.fixado);
 const somaFixos=fixos.reduce((s,x)=>s+Math.max(0,num(x.qtdAlvo))*num(x.p.valor),0);
 const restante=Math.max(0,metaBase-somaFixos);
 const shareAuto=autos.length?restante/autos.length:0;
 const qtyFinal={};
 fixos.forEach(x=>qtyFinal[x.id]=Math.max(0,Math.round(num(x.qtdAlvo))));
 autos.forEach(x=>{const preco=num(x.p.valor);qtyFinal[x.id]=preco>0?Math.ceil(shareAuto/preco):0});
 return{prods,metaBase,qtyFinal};
}

/* ============ PRODUÇÃO ============ */
function filtraItens(){
 const q=UI.busca.trim().toLowerCase();
 return S.itens.filter(i=>{
  if(UI.fStatus==='abertos'&&!aberto(i))return false;
  if(UI.fStatus==='atrasados'&&!atrasado(i))return false;
  if(!['todos','abertos','atrasados'].includes(UI.fStatus)&&i.status!==UI.fStatus)return false;
  if(q&&!(`${i.nome} ${i.tipo} ${nomeCli(i.clienteId)}`.toLowerCase().includes(q)))return false;
  return true;
 }).sort((a,b)=>{
  const sa=STATUS[a.status]?.ord??9,sb=STATUS[b.status]?.ord??9;
  if(sa!==sb)return sa-sb;
  return (a.dataEntrega||'9')<(b.dataEntrega||'9')?-1:1;
 });
}

/* ============ ENTREGAS + AGENDA ============ */
function eventos(){
 const L=[];
 S.itens.filter(i=>i.status!=='cancelado').forEach(i=>{
  if(i.dataEntrega)L.push({t:'Entrega',data:i.dataEntrega,item:i});
  if(i.dataPostagem)L.push({t:'Postagem',data:i.dataPostagem,item:i});
 });
 return L.sort((a,b)=>a.data<b.data?-1:1);
}
function vEntregas(){
 const ev=eventos(),prox=ev.filter(e=>{const d=diasAte(e.data);return d>=0&&d<=7&&aberto(e.item)}).length;
 const atr=ev.filter(e=>diasAte(e.data)<0&&aberto(e.item)).length;
 return `
 <div class="grid g2">
  ${stat(prox,'nos próximos 7 dias','cal')}
  ${stat(atr,'em atraso','alerta')}
 </div>
 <div class="chips" style="margin-top:12px">
  <button data-vista="lista" aria-pressed="${UI.entregaVista==='lista'}">Lista</button>
  <button data-vista="agenda" aria-pressed="${UI.entregaVista==='agenda'}">Agenda do mês</button>
 </div>
 ${UI.entregaVista==='agenda'?agenda():listaEventos(ev)}`;
}
function listaEventos(ev){
 const fut=ev.filter(e=>aberto(e.item));
 if(!fut.length)return vazio('truck','Nada agendado','Defina datas de entrega e postagem nos pedidos.');
 return `<div class="list">${fut.map(e=>{
  const d=diasAte(e.data),vencido=d<0;
  return `<button class="rowcard" data-item="${e.item.id}" style="display:flex;align-items:center;gap:12px">
   <span style="width:50px;height:50px;border-radius:15px;background:${vencido?'var(--dangerBg)':'var(--soft2)'};
    color:${vencido?'var(--danger)':'var(--accent)'};display:grid;place-items:center;flex-shrink:0;line-height:1.05">
    <b style="font-size:9px;letter-spacing:.06em">${e.t==='Entrega'?'ENTREGA':'POSTAR'}</b>
    <b style="font-size:13px;font-family:Fraunces,serif">${fmtData(e.data)}</b></span>
   <span style="flex:1;min-width:0">
    <b style="font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.item.nome)}</b>
    <span class="dim" style="font-size:12px">${esc(nomeCli(e.item.clienteId))} · ${vencido?`atrasado ${Math.abs(d)}d`:d===0?'hoje':`em ${d}d`}</span></span>
   ${e.item.rastreio?`<span class="chip">rastreio</span>`:''}
  </button>`}).join('')}</div>`;
}
function agenda(){
 const y=UI.calAno,m=UI.calMes,prim=new Date(y,m,1).getDay(),dias=new Date(y,m+1,0).getDate();
 const ev=eventos();
 const porDia={};
 ev.forEach(e=>{const[a,b,c]=e.data.split('-');if(+a===y&&+b===m+1){(porDia[+c]=porDia[+c]||[]).push(e)}});

 let cels='';

 const comMargem=base*(1+num(c.margem)/100);
 const taxa=num(c.taxa);
 const preco=taxa>0&&taxa<100?comMargem/(1-taxa/100):comMargem;

/* ============ sheet ============ */
let sheetSubmit=null,sheetAberto=false;
function abrir(tit,corpo,depois){
 $('#sheetTit').textContent=tit;$('#sheetBody').innerHTML=corpo;
 $('#sheet').classList.add('on');$('#scrim').classList.add('on');sheetAberto=true;
 $('#sheetBody').scrollTop=0;document.body.style.overflow='hidden';
 if(depois)depois();
}
function fechar(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');sheetAberto=false;
 sheetSubmit=null;document.body.style.overflow='';}
/* arrastar para fechar */
(()=>{let y0=null;const g=$('#grab'),sh=$('#sheet');
 const move=e=>{if(y0===null)return;const dy=Math.max(0,(e.touches?e.touches[0].clientY:e.clientY)-y0);
  sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`};
 const up=e=>{if(y0===null)return;const dy=Math.max(0,((e.changedTouches?e.changedTouches[0].clientY:e.clientY)||0)-y0);
  sh.style.transition='';sh.style.transform='';y0=null;if(dy>90)fechar()};
 const down=e=>{y0=(e.touches?e.touches[0].clientY:e.clientY)};
 g.addEventListener('touchstart',down,{passive:true});g.addEventListener('touchmove',move,{passive:true});
 g.addEventListener('touchend',up);g.addEventListener('mousedown',down);
 addEventListener('mousemove',move);addEventListener('mouseup',up);})();

/* ============ toast com desfazer ============ */
let toastT,undoFn=null;
function toast(msg,undo){
 clearTimeout(toastT);$('#toastMsg').textContent=msg;undoFn=undo||null;
 $('#toastBtn').classList.toggle('hide',!undo);$('#toast').classList.add('on');
 toastT=setTimeout(()=>{$('#toast').classList.remove('on');undoFn=null},undo?5200:2600);
}

/* ============ baixa de estoque ============ */
function aplicarBaixa(it,sinal){
 (it.materiais||[]).forEach(m=>{
  const e=S.estoque.find(x=>x.id===m.mid);
  if(e)e.qtd=Math.max(0,Math.round((num(e.qtd)-sinal*num(m.qtd))*1000)/1000);
 });
}
function mudarStatus(it,novo){
 const ant=it.status;if(ant===novo)return;
 it.status=novo;
 if(novo==='entregue')it.dataConclusao=it.dataConclusao||hoje();
 if(ant==='entregue'&&novo!=='entregue')it.dataConclusao=null;
 /* materiais saem do estoque quando a peça fica pronta e voltam se o pedido regredir */
 const consumido=novo==='pronto'||novo==='entregue';
 if(consumido&&!it.baixaFeita&&(it.materiais||[]).length){
  aplicarBaixa(it,1);it.baixaFeita=true;toast('Estoque baixado automaticamente')}
 if(!consumido&&it.baixaFeita){aplicarBaixa(it,-1);it.baixaFeita=false;toast('Materiais devolvidos ao estoque')}
 salvar();
}

function comprimir(file,maxL,cb){
 const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,maxL/Math.max(im.width,im.height));
  const cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
  cb(cv.toDataURL('image/jpeg',.75))};im.src=r.result};
 r.readAsDataURL(file);
}

/* ============ eventos ============ */
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-view],[data-act],[data-pai],[data-per],[data-fst],[data-vista],[data-mes],[data-dia],[data-item],[data-cliente],[data-produto],[data-edit-mat],[data-status],[data-etapa],[data-pgadd],[data-pgdel],[data-pgquit],[data-baixa],[data-wa],[data-wacli],[data-edititem],[data-delitem],[data-editcli],[data-delcli],[data-editprod],[data-delprod],[data-delmat],[data-novoped],[data-qtd],[data-tema],[data-modo],[data-ord],[data-esc],[data-notiftg],[data-fonte],[data-rmet],[data-rmmat],[data-rmextra],[data-rmmeta],[data-metaauto]');
 if(!t)return;
 const d=t.dataset;

 if(d.view){if(UI.view!==d.view)viewStack.push(d.view);UI.view=d.view;fechar();render();scrollTo({top:0});return}
 if(d.pai){UI.pai=d.pai;render();scrollTo({top:0});return}
 if(d.ord){const[i,dir]=d.ord.split('|').map(Number),a=S.cfg.ordemPainel,j=i+dir;
  if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];
  if(!a.includes(UI.pai))UI.pai=a[0];salvar();render();return}
 if(d.esc){S.cfg.escala=d.esc;salvar();render();return}
 if(d.notiftg){S.cfg.notif[d.notiftg]=!S.cfg.notif[d.notiftg];salvar();render();return}
 if(d.per){UI.periodo=d.per==='tudo'?'tudo':+d.per;render();return}
 if(d.fst){UI.fStatus=d.fst;render();return}
 if(d.vista){UI.entregaVista=d.vista;render();return}
 if(d.mes){let m=UI.calMes+ +d.mes,y=UI.calAno;if(m<0){m=11;y--}if(m>11){m=0;y++}UI.calMes=m;UI.calAno=y;render();return}
 if(d.dia){sheetDia(d.dia);return}
 if(d.item){detalheItem(d.item);return}
 if(d.cliente){detalheCliente(d.cliente);return}
 if(d.produto){detalheProduto(d.produto);return}
 if(d.editMat){formMaterial(d.editMat);return}
 if(d.tema){
  const k=d.tema,noturna=!!PALETAS[k]?.noturna;
  S.tema=k;
  if(noturna)S.modo='escuro';
  const v=varsTema(k,noturna||escuroAtivo());
  /* o editor de tonalidade já abre carregado com as cores desta paleta */
  S.custom={a:{c:v.accent,t:0},b:{c:v.soft,t:0},c:{c:v.bg,t:0},base:PALETAS[k]?.nome||''};
  salvar();render();
  setTimeout(()=>{const el=document.querySelector('[data-cor="a"]')?.closest('.sect');
   if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-70,behavior:'smooth'})},60);
  return}
 if(d.modo){S.modo=d.modo;salvar();render();return}

 if(d.status){const[id,st]=d.status.split(':');const it=S.itens.find(i=>i.id===id);
  if(it){mudarStatus(it,st);detalheItem(id);render()}return}
 if(d.etapa){const[id,i]=d.etapa.split(':');const it=S.itens.find(x=>x.id===id);
  if(it){it.etapas[i].feita=!it.etapas[i].feita;
   if(it.status==='orcamento')it.status='producao';
   if(it.etapas.every(e=>e.feita)&&it.status==='producao')it.status='pronto';
   salvar();detalheItem(id);render()}return}
 if(d.pgadd){const it=S.itens.find(x=>x.id===d.pgadd),v=num(val('pgVal'));
  if(!v)return toast('Informe o valor');
  it.pagamentos.push({id:uid(),data:hoje(),valor:v,forma:val('pgForma')});salvar();detalheItem(it.id);render();toast('Pagamento lançado');return}
 if(d.pgquit){const it=S.itens.find(x=>x.id===d.pgquit),v=saldoItem(it);
  it.pagamentos.push({id:uid(),data:hoje(),valor:v,forma:'Pix'});salvar();detalheItem(it.id);render();toast('Saldo quitado');return}
 if(d.pgdel){const[id,pid]=d.pgdel.split(':');const it=S.itens.find(x=>x.id===id);

 if(d.baixa){const it=S.itens.find(x=>x.id===d.baixa);
  aplicarBaixa(it,it.baixaFeita?-1:1);it.baixaFeita=!it.baixaFeita;salvar();detalheItem(it.id);render();

 if(d.wa){const[id,i]=d.wa.split(':');const it=S.itens.find(x=>x.id===id);
  wa(cli(it.clienteId)?.telefone,msgsItem(it)[i][1]);return}
 if(d.wacli){const[id,tipo]=d.wacli.split(':');const c=cli(id);

 if(d.qtd){const e=mat(d.qtd);const passo=num(e.consumoPorItem)&&num(e.consumoPorItem)<1?num(e.consumoPorItem):1;

 if(d.metaauto){const item=S.cfg.metas.produtos.find(x=>x.id===d.metaauto);
  if(item){item.fixado=false;salvar();render();toast('Voltou a calcular automaticamente')}return}

 if(d.delitem){const i=S.itens.findIndex(x=>x.id===d.delitem),bk=S.itens[i];
  S.itens.splice(i,1);salvar();fechar();render();toast('Pedido excluído',()=>S.itens.splice(i,0,bk));return}
 if(d.delcli){const i=S.clientes.findIndex(x=>x.id===d.delcli),bk=S.clientes[i];

 if(d.delmat){const i=S.estoque.findIndex(x=>x.id===d.delmat),bk=S.estoque[i];

 switch(d.act){

   S.custom={a:{c:v.accent,t:0},b:{c:v.soft,t:0},c:{c:v.bg,t:0},base:PALETAS[S.tema]?.nome||''};
   salvar();render();toast('Cores copiadas da paleta atual');break}
  case'busca':sheetBusca();break;
  case'calc':sheetCalc();break;
  case'ics':baixarICS();break;
  case'notif-testar':{const a=textoAviso();
   if(Notification.permission!=='granted')return ativarNotif();
   mostrarNotif(a?a.titulo:'Nenhum prazo pendente',a?a.corpo:'Tudo em dia por aqui.');
   toast('Aviso enviado');break}
  case'notif-toggle':{
   if(S.cfg.notif.ativo){S.cfg.notif.ativo=false;salvar();render();toast('Avisos desligados')}
   else ativarNotif();break}
  case'novo-item':formItem(null);break;
  case'novo-material':formMaterial(null);break;
  case'novo-cliente':formCliente(null);break;
  case'novo-produto':formProduto(null);break;
  case'fechar':fechar();break;
  case'auth-alternar':authModo=authModo==='cadastro'?'login':'cadastro';mostrarAuth();break;
  case'auth-entrar':{
   const email=val('authEmail').trim(),senha=val('authSenha');
   if(!email||!senha)return toast('Preencha e-mail e senha');
   firebase.auth().signInWithEmailAndPassword(email,senha).catch(erroAuth);break}
  case'auth-cadastrar':{
   const email=val('authEmail').trim(),senha=val('authSenha');
   if(!email||!senha)return toast('Preencha e-mail e senha');
   firebase.auth().createUserWithEmailAndPassword(email,senha).catch(erroAuth);break}
  case'auth-esqueci':{
   const email=val('authEmail').trim();
   if(!email)return toast('Digite seu e-mail primeiro');
   firebase.auth().sendPasswordResetEmail(email).then(()=>toast('E-mail de redefinição enviado')).catch(erroAuth);break}
  case'sair':firebase.auth().signOut();break;
  case'modo':S.modo=escuroAtivo()?'claro':'escuro';salvar();render();break;
  case'lista-compras':listaCompras();break;
  case'add-etapa':lerItem();FORM.etapas.push({nome:'',data:hoje(),feita:false});$('#sheetBody').innerHTML=corpoItem();break;
  case'add-mat':lerItem();FORM.materiais.push({mid:S.estoque[0]?.id||'',qtd:1});$('#sheetBody').innerHTML=corpoItem();break;
  case'add-extra':{
   lerItem();FORM.extras=FORM.extras||[];
   FORM.extras.push({produtoId:'',titulo:'',quantidade:1,custoMaterial:'',valorVenda:'',tempoHoras:'',materiais:[]});
   if(!FORM.pedidoCod)FORM.pedidoCod=novoPedidoCod();
   $('#sheetBody').innerHTML=corpoItem();break}
  case'salvar-item':salvarItem();break;
  case'add-meta-produto':{
   const pid=val('metaProdSel');if(!pid)return toast('Escolha um produto');
   const p=S.catalogo.find(x=>x.id===pid);if(!p)break;
   S.cfg.metas.produtos=S.cfg.metas.produtos||[];
   if(!S.cfg.metas.produtos.find(x=>x.id===pid))S.cfg.metas.produtos.push({id:pid,qtdAlvo:0,fixado:false});
   salvar();render();toast('Produto adicionado à meta');break}
  case'desp-toggle':S.cfg.despesas.incluir=!S.cfg.despesas.incluir;salvar();render();break;
  case'toggle-meta-produtos':UI.metaProdutosAberto=!UI.metaProdutosAberto;render();break;
  case'novo-cliente-rapido':lerItem();formCliente(null,'item');break;
  case'novo-produto-rapido':lerItem();formProduto(null,'item');break;
  case'salvar-cliente':{
   const nome=val('cNome').trim();if(!nome)return toast('Informe o nome');
   const dados={nome,telefone:val('cTel'),email:val('cMail'),endereco:val('cEnd')};
   if(d.id){Object.assign(cli(d.id),dados);salvar();fechar();render();toast('Cliente atualizado')}
   else{const novo={id:uid(),...dados};S.clientes.push(novo);salvar();
    if(d.volta==='item'){FORM.clienteId=novo.id;abrir('Novo pedido',corpoItem())}else{fechar();render()}
    toast('Cliente salvo')}
   break}
  case'salvar-material':{
   const nome=val('mNome').trim();if(!nome)return toast('Informe o nome');
   const dados={nome,qtd:num(val('mQtd')),minimo:num(val('mMin')),unidade:val('mUn')||'un',
    custoUnitario:num(val('mCusto')),consumoPorItem:num(val('mCons')),producaoMensal:num(val('mProd')),
    recorrente:$('#mRec')?.getAttribute('aria-pressed')==='true',periodo:val('mPer')||'mensal'};
   if(d.id)Object.assign(mat(d.id),dados);else S.estoque.push({id:uid(),...dados});
   salvar();fechar();render();toast('Material salvo');break}
  case'salvar-produto':{
   const titulo=val('pTit').trim();if(!titulo)return toast('Informe o nome do produto');
   const dados={titulo,valor:num(val('pVal')),custoProducao:num(val('pCusto')),
    tempoConfeccao:num(val('pTemp')),qtdEstoque:num(val('pQtd')),imagem:IMG_TMP};
   if(d.id){const p=S.catalogo.find(x=>x.id===d.id);Object.assign(p,dados);salvar();
    if(d.volta==='item'){abrir(FORM.id?'Editar pedido':'Novo pedido',corpoItem())}else{fechar();render()}
    toast('Produto atualizado')}
   else{S.catalogo.push({id:uid(),materiais:[],...dados});salvar();
    if(d.volta==='item'){abrir(FORM.id?'Editar pedido':'Novo pedido',corpoItem())}else{fechar();render()}
    toast('Produto salvo')}
   break}
  case'exportar':{
   const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
   const a=document.createElement('a');a.href=URL.createObjectURL(b);
   a.download=`atelie-backup-${hoje()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
   toast('Backup exportado');break}
  case'importar':$('#fileImport').click();break;
  case'zerar':
   if(confirm('Apagar TODOS os dados deste aparelho? Exporte um backup antes.')){
    localStorage.removeItem(CHAVE);S=seed();salvar();render();toast('Dados apagados')}
   break;
 }
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='fileImport'&&el.files[0]){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
   if(!d||!Array.isArray(d.itens))throw 0;
   S=migrar(d);salvar();render();toast('Backup importado')}catch(x){toast('Arquivo inválido')}};
  r.readAsText(el.files[0]);el.value='';return}
 if(el.id==='fProd'&&el.value){
  const p=S.catalogo.find(x=>x.id===el.value);if(!p)return;
  lerItem();
  const qtd=Math.max(1,num(FORM.quantidade)||1);
  FORM.nome=p.titulo;FORM.produtoId=p.id;
  FORM.custoMaterial=+(num(p.custoProducao)*qtd).toFixed(2);FORM.valorVenda=+(num(p.valor)*qtd).toFixed(2);
  FORM.tempoHoras=+(num(p.tempoConfeccao)*qtd).toFixed(3);
  FORM.materiais=JSON.parse(JSON.stringify(p.materiais||[])).map(m=>({mid:m.mid,qtd:+(num(m.qtd)*qtd).toFixed(4)}));
  $('#sheetBody').innerHTML=corpoItem();toast('Dados do produto aplicados');return;
 }
 if(el.id==='fQtd'){
  const qtdAnterior=Math.max(1,num(FORM.quantidade)||1);
  lerItem();
  const novaQtd=Math.max(1,Math.round(num(FORM.quantidade))||1);
  FORM.quantidade=novaQtd;
  FORM.custoMaterial=+(num(FORM.custoMaterial)/qtdAnterior*novaQtd).toFixed(2);
  FORM.valorVenda=+(num(FORM.valorVenda)/qtdAnterior*novaQtd).toFixed(2);
  FORM.tempoHoras=+(num(FORM.tempoHoras)/qtdAnterior*novaQtd).toFixed(3);
  FORM.materiais=FORM.materiais.map(m=>({mid:m.mid,qtd:+(num(m.qtd)/qtdAnterior*novaQtd).toFixed(4)}));
  $('#sheetBody').innerHTML=corpoItem();return;
 }
 if(el.dataset.exprod!==undefined){
  const i=+el.dataset.exprod;
  lerItem();
  const x=FORM.extras[i];if(!x)return;
  const p=S.catalogo.find(c=>c.id===el.value);
  if(p){
   const qtd=Math.max(1,num(x.quantidade)||1);
   x.produtoId=p.id;x.titulo=p.titulo;
   x.custoMaterial=+(num(p.custoProducao)*qtd).toFixed(2);
   x.valorVenda=+(num(p.valor)*qtd).toFixed(2);
   x.tempoHoras=+(num(p.tempoConfeccao)*qtd).toFixed(3);
   x.materiais=JSON.parse(JSON.stringify(p.materiais||[])).map(m=>({mid:m.mid,qtd:+(num(m.qtd)*qtd).toFixed(4)}));
  }else{x.produtoId='';x.titulo=''}
  $('#sheetBody').innerHTML=corpoItem();return;
 }
 if(el.dataset.exqtd!==undefined){
  const i=+el.dataset.exqtd;
  const qtdAnterior=Math.max(1,num(FORM.extras[i]?.quantidade)||1);
  lerItem();
  const x=FORM.extras[i];if(!x)return;
  const novaQtd=Math.max(1,Math.round(num(x.quantidade))||1);
  x.quantidade=novaQtd;
  x.custoMaterial=+(num(x.custoMaterial)/qtdAnterior*novaQtd).toFixed(2);
  x.valorVenda=+(num(x.valorVenda)/qtdAnterior*novaQtd).toFixed(2);
  x.tempoHoras=+(num(x.tempoHoras)/qtdAnterior*novaQtd).toFixed(3);
  x.materiais=(x.materiais||[]).map(m=>({mid:m.mid,qtd:+(num(m.qtd)/qtdAnterior*novaQtd).toFixed(4)}));
  $('#sheetBody').innerHTML=corpoItem();return;
 }
 if(el.dataset.metaqtd){
  const item=S.cfg.metas.produtos.find(x=>x.id===el.dataset.metaqtd);
  if(item){item.qtdAlvo=Math.max(0,Math.round(num(el.value))||0);item.fixado=true;salvar();render();}
 }
});
document.addEventListener('change',e=>{
 const d=e.target.dataset;
 if(d.fonte){S.cfg[d.fonte]=e.target.value;salvar();render();}
});
document.addEventListener('input',e=>{
 const d=e.target.dataset;
 if(d.prodmes){const m=mat(d.prodmes);if(m){m.producaoMensal=num(e.target.value);salvar();
  clearTimeout(window._rt);window._rt=setTimeout(render,600)}return}
 if(d.calc){CALC[d.calc]=e.target.value;clearTimeout(window._rc);
  window._rc=setTimeout(()=>{const a=document.activeElement?.dataset?.calc;
   if(sheetAberto)$('#sheetBody').innerHTML=corpoCalc();else render();
   if(a){const el=document.querySelector(`[data-calc="${a}"]`);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}}},450);return}
 if(d.cfg){
  const txt=['nomeAtelie','subtitulo'];
  S.cfg[d.cfg]=txt.includes(d.cfg)?e.target.value:num(e.target.value);salvar();
  if(txt.includes(d.cfg)){$('#hSub').textContent=S.cfg.subtitulo||'';
   $('#hTitulo').textContent=S.cfg.nomeAtelie||'Minha Produção';document.title=S.cfg.nomeAtelie}
  if(sheetAberto){clearTimeout(window._rp);window._rp=setTimeout(()=>{
   const a=document.activeElement?.dataset?.cfg;$('#sheetBody').innerHTML=corpoCalc();
   if(a){const el=document.querySelector(`[data-cfg="${a}"]`);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}}},450)}
  else if(!sheetAberto&&UI.view==='config'&&!txt.includes(d.cfg)){clearTimeout(window._rcfg);window._rcfg=setTimeout(()=>{
   const a=document.activeElement?.dataset?.cfg;render();
   if(a){const el=document.querySelector(`[data-cfg="${a}"]`);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}}},450)}}
 if(d.notif){S.cfg.notif[d.notif]=e.target.value;salvar();return}
 if(d.desp){
  S.cfg.despesas[d.desp]=num(e.target.value);salvar();
  clearTimeout(window._rd);window._rd=setTimeout(()=>{
   const a=document.activeElement?.dataset?.desp;render();
   if(a){const el=document.querySelector(`[data-desp="${a}"]`);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}}
  },450);return}
 if(d.meta){
  S.cfg.metas[d.meta]=num(e.target.value);salvar();
  clearTimeout(window._rme);window._rme=setTimeout(()=>{
   const a=document.activeElement?.dataset?.meta;render();
   if(a){const el=document.querySelector(`[data-meta="${a}"]`);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}}
  },450);return}
 if(d.cor||d.tom){
  const k=d.cor||d.tom;
  if(d.cor){S.custom[k].c=e.target.value;S.custom.base=''}else S.custom[k].t=+e.target.value;
  if(S.tema!=='custom'){S.tema='custom';
   document.querySelectorAll('.palcard').forEach(b=>b.setAttribute('aria-pressed','false'));
   const bt=document.querySelector('[data-act="usar-custom"]');
   if(bt){bt.className='btn primary sm';bt.innerHTML=ic('check',15)+' Em uso'}}
  clearTimeout(window._sc);window._sc=setTimeout(salvar,300);
  aplicarTema();return}
});
$('#scrim').onclick=fechar;
addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetAberto)fechar()});
addEventListener('scroll',()=>{$('#hd').classList.toggle('scrolled',scrollY>6)},{passive:true});

/* ============ botão/gesto de voltar ============ */
/* Mantemos sempre uma entrada extra no histórico do navegador. Assim o gesto/botão
   de voltar do celular nunca fecha o app: ele sempre encontra algo para "desfazer"
   aqui dentro. Se houver uma aba (sheet) aberta, ela fecha; senão, volta para a
   página/seção anterior; se não houver anterior, o app simplesmente permanece. */
history.replaceState({guard:true},'');
history.pushState({guard:true},'');
addEventListener('popstate',()=>{
 if(sheetAberto){fechar();}
 else if(viewStack.length>1){viewStack.pop();UI.view=viewStack[viewStack.length-1];render();scrollTo({top:0});}
 history.pushState({guard:true},'');
});

/* ============ AUTENTICAÇÃO (Firebase — login com e-mail) ============ */
let AUTH_USER=null,authModo='login',_appIniciado=false;
function telaAuth(){
 const cad=authModo==='cadastro';
 return `
 <div class="card">
  <h1 class="disp" style="font-size:20px;text-align:center;margin-bottom:4px">${esc(S.cfg?.nomeAtelie||'Minha Produção')}</h1>
  <p class="dim" style="text-align:center;font-size:12.5px;margin-bottom:18px">${cad?'Criar sua conta':'Entrar na sua conta'}</p>
  <label class="field"><span>E-mail</span><input class="input" id="authEmail" type="email" autocomplete="username" placeholder="voce@email.com"></label>
  <label class="field"><span>Senha</span><input class="input" id="authSenha" type="password" autocomplete="${cad?'new-password':'current-password'}" placeholder="Mínimo 6 caracteres"></label>
  <button class="btn primary" data-act="${cad?'auth-cadastrar':'auth-entrar'}" style="margin-top:6px">${cad?'Criar conta':'Entrar'}</button>
  <button class="btn line sm" data-act="auth-alternar" style="margin-top:10px">${cad?'Já tenho conta — entrar':'Não tenho conta — criar'}</button>
  ${!cad?`<button class="btn sm" data-act="auth-esqueci" style="margin-top:2px;color:var(--accent);font-weight:700">Esqueci minha senha</button>`:''}
 </div>`;
}
function mostrarAuth(){$('#authGate').classList.remove('hide');$('#authGate').innerHTML=telaAuth();document.body.style.overflow='hidden'}
function ocultarAuth(){$('#authGate').classList.add('hide');document.body.style.overflow=''}
function erroAuth(e){
 const map={'auth/invalid-email':'E-mail inválido','auth/user-not-found':'Conta não encontrada',
  'auth/wrong-password':'Senha incorreta','auth/email-already-in-use':'Este e-mail já tem uma conta',
  'auth/weak-password':'Senha muito curta (mínimo 6 caracteres)','auth/invalid-credential':'E-mail ou senha incorretos',
  'auth/too-many-requests':'Muitas tentativas — aguarde um pouco','auth/network-request-failed':'Sem conexão com a internet'};
 toast(map[e.code]||('Erro: '+(e.message||e.code||'tente novamente')));
}
function iniciarApp(){
 render();
 if(_appIniciado)return;
 _appIniciado=true;
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 setTimeout(checarLembretes,2500);
 setInterval(checarLembretes,60000);
 addEventListener('visibilitychange',()=>{if(!document.hidden&&AUTH_USER)checarLembretes()});
}
firebase.auth().onAuthStateChanged(user=>{
 AUTH_USER=user;
 if(user){S=carregarParaUsuario(user.uid);ocultarAuth();iniciarApp()}
 else{authModo='login';mostrarAuth()}
});

/* ============ start ============ */
mostrarAuth(); /* fica visível até o Firebase confirmar se há sessão ativa */
</script>
